        function speakArabicVoiceNav(text) {

        function calcGeoDistanceKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function processAutoVoiceNavigationAndSpeed(coords) {
            if (!coords || !coords.lat) return;

            const speed = coords.speed || 0;
            if (speed > 90) {
                speakArabicVoiceNav("تنبيه: تجاوزت السرعة المقررة للسيارة. يرجى القيادة بحذر.");
            }

            for (let clientName in cloudClientsLocations) {
                let loc = cloudClientsLocations[clientName];
                if (loc && loc.lat && loc.lng && !alertedClients.has(clientName)) {
                    let distKm = calcGeoDistanceKm(coords.lat, coords.lng, loc.lat, loc.lng);
                    let distMeters = Math.round(distKm * 1000);

                    if (distMeters <= 150) {
                        alertedClients.add(clientName);
                        speakArabicVoiceNav(`انتبه، أنت تقترب من محل ${clientName}، على بُعد ${distMeters} متر.`);
                        setTimeout(() => { alertedClients.delete(clientName); }, 1800000);
                        break;
                    }
                }
            }
        }

        async function printDirectBluetoothESC(specificInv = null) {
            const rec = specificInv || (await createInvoiceObject());
            if (!rec) return;

            let char = window.bluetoothPrinterChar;
            if (!char || !window.bluetoothPrinterDevice || !window.bluetoothPrinterDevice.gatt.connected) {
                char = await connectDirectBluetoothThermal();
                if (!char) return;
            }

            try {
                let cName = systemSettings.companyName || "BLACK HORSE";
                let cTax = systemSettings.taxInfo || "كود النشاط: 7761 | س.ت: 76027";

                let receiptText = `     [ ${cName} ]\n${systemSettings.companySubtitle || 'شركة بلاك هورس - موزع معتمد'}\n${cTax}\n--------------------------------\nالتاريخ: ${rec.date}\nفاتورة: #${rec.invNo}\nالسيارة: ${rec.vehicleName || 'عام'} (عداد: ${rec.odometer || '-'} كم)\nالعميل: ${rec.client}\n${rec.village ? `القرية: ${rec.village}\n`:''}--------------------------------\nالمنتج          الكمية  السعر  الإجمالي\n--------------------------------\n`;
                
                rec.items.forEach(it => {
                    let nameLine = it.name.padEnd(16, ' ').substring(0, 16);
                    let qStr = String(it.qty).padStart(4, ' ');
                    let pStr = String(it.price).padStart(6, ' ');
                    let totStr = it.total.toFixed(2).padStart(8, ' ');
                    receiptText += `${nameLine} ${qStr} ${pStr} ${totStr}\n`;
                });
                
                receiptText += `--------------------------------\nالإجمالي الكلي:        ${rec.total.toFixed(2)} ج.م\n--------------------------------\n       شكراً لتعاملكم معنا\n\n\n\n`;

                const encoder = new TextEncoder();
                const initCmd = new Uint8Array([0x1B, 0x40]);
                const textBytes = encoder.encode(receiptText);
                const cutCmd = new Uint8Array([0x1D, 0x56, 0x41, 0x00]);

                const fullPayload = new Uint8Array(initCmd.length + textBytes.length + cutCmd.length);
                fullPayload.set(initCmd, 0);
                fullPayload.set(textBytes, initCmd.length);
                fullPayload.set(cutCmd, initCmd.length + textBytes.length);

                const CHUNK_SIZE = 100;
                for (let i = 0; i < fullPayload.length; i += CHUNK_SIZE) {
                    const chunk = fullPayload.slice(i, i + CHUNK_SIZE);
                    if (char.properties.writeWithoutResponse) {
                        await char.writeValueWithoutResponse(chunk);
                    } else {
                        await char.writeValue(chunk);
                    }
                    await new Promise(r => setTimeout(r, 25));
                }

                alert("✅ تم إرسال أمر الطباعة بنجاح إلى الطابعة الحرارية مباشرة!");
                if (!specificInv && currentDelegate) {
                    initSalesForm();
                }
            } catch (err) {
                console.error("Print Error:", err);
                alert("❌ حدث خطأ أثناء إرسال أمر الطباعة: " + err.message);
            }
        }

        async function connectDirectBluetoothThermal() {
            try {
                if (!navigator.bluetooth) {
                    alert("⚠️ البلوتوث المباشر غير مدعوم في هذا المتصفح. استخدم زر RawBT للطباعة السريعة.");
                    return null;
                }
                const device = await navigator.bluetooth.requestDevice({
                    filters: [
                        { namePrefix: 'XP-' }, { namePrefix: 'MPT-' }, { namePrefix: 'RP-' },
                        { namePrefix: 'Printer' }, { namePrefix: 'Bluetooth' }
                    ],
                    optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb', '49535343-fe7d-4ae5-8fa9-9fafd205e455', 'e7810a71-73ae-499d-8c15-faa9aef0c3f2']
                });

                const server = await device.gatt.connect();
                let targetService = null;
                const services = await server.getPrimaryServices();
                for (let s of services) {
                    targetService = s;
                    break;
                }

                if (!targetService) throw new Error("تعذر العثور على قناة الطباعة الحرارية.");
                const characteristics = await targetService.getCharacteristics();
                let char = characteristics.find(c => c.properties.write || c.properties.writeWithoutResponse);

                window.bluetoothPrinterDevice = device;
                window.bluetoothPrinterChar = char;

                const stDiv = document.getElementById('btPrinterStatus');
                if (stDiv) {
                    stDiv.style.display = 'block';
                    stDiv.innerText = `✅ متصل بطابعة: ${device.name}`;
                }
                alert(`✅ تم الاقتران بنجاح مع الطابعة: ${device.name}`);
                return char;
            } catch (e) {
                console.warn("Bluetooth Connect Error:", e);
                return null;
            }
        }

        function playBeep(success = true) {

                const gain = audioCtx.createGain();
                osc.type = success ? 'sine' : 'sawtooth';
                osc.frequency.setValueAtTime(success ? 1200 : 350, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + (success ? 0.12 : 0.28));
            } catch(e) {}
        }

            if (e.key === 'Enter') {
                if (barcodeBuffer.length >= 2) {
                    processBarcodeString(barcodeBuffer.trim());

        function checkCurrentVehicleOilLimit() {
            const vKey = document.getElementById('invoiceVehicleSelect')?.value;
            const odoVal = parseFloat(document.getElementById('invoiceOdometerInput')?.value) || 0;
            const statusDiv = document.getElementById('vehicleOilStatusText');
            if(!statusDiv || !vKey) return;

            const car = cloudVehicles[vKey];
            if(!car) return;

            const lastOil = parseFloat(car.lastOilKm) || 0;
            const effectiveKm = odoVal > 0 ? odoVal : (car.currentKm || 0);
            const driven = effectiveKm - lastOil;
            const limit = car.interval || 1500;
            const remaining = limit - driven;

            if(driven >= limit) {
                statusDiv.innerHTML = `<span style="color:#dc2626;">🚨 تنبيه غيار زيت: قطعت السيارة (${driven} كم) منذ آخر غيار وتجاوزت الـ ${limit} كم! يرجى غيار الزيت.</span>`;
            } else {
                statusDiv.innerHTML = `<span style="color:#16a34a;">🟢 حالة الزيت جيدة: قطعت (${driven} كم)، المتبقي حتى غيار الزيت: (${remaining} كم).</span>`;
            }
        }

            const delCode = document.getElementById('selectDelegateForStock').value;

            const qty = parseFloat(document.getElementById('qtyTransferProductCar').value) || 0;

            if(qty <= 0) { alert("أدخل كمية كراتين صحيحة."); return; }

            cloudDelegates[delCode].carStock[pCode] = parseFloat(((cloudDelegates[delCode].carStock[pCode] || 0) + qty).toFixed(4));

            db.ref('productsList').set(products);
            db.ref('delegates/' + delCode + '/carStock').set(cloudDelegates[delCode].carStock).then(() => {

                renderCarStockTable();

        function getCurrentGpsCoords() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve(latestCoords || null);
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const coords = { 
                            lat: pos.coords.latitude, 
                            lng: pos.coords.longitude,
                            speed: pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0
                        };
                        latestCoords = coords;
                        resolve(coords);
                    },
                    (err) => {
                        console.warn("GPS Warning:", err);
                        resolve(latestCoords || null);
                    },
                    { enableHighAccuracy: true, timeout: 7000, maximumAge: 0 }
                );
            });
        }

        function startTrackingDelegateLocation() {
            if (!navigator.geolocation || !currentDelegate || currentDelegate.role !== 'delegate') return;
            
            keepScreenAwake();

            getCurrentGpsCoords().then(coords => {
                if(coords) {
                    const timeStr = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
                    db.ref('locations/' + currentDelegate.code).update({
                        name: currentDelegate.name,
                        lat: coords.lat,
                        lng: coords.lng,
                        speed: coords.speed || 0,
                        updatedAt: timeStr,
                        timestamp: Date.now()
                    }).catch(() => {});
                }
            });

            if (watchPositionId) navigator.geolocation.clearWatch(watchPositionId);

            watchPositionId = navigator.geolocation.watchPosition(
                (pos) => {
                    const spd = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
                    latestCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude, speed: spd };
                    const timeStr = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
                    
                    const spdElem = document.getElementById('carSpeedometer');
                    if (spdElem) spdElem.innerText = `السرعة: ${spd} كم/س`;

                    processAutoVoiceNavigationAndSpeed(latestCoords);

                    db.ref('locations/' + currentDelegate.code).update({
                        name: currentDelegate.name,
                        lat: pos.coords.latitude,
                        lng: pos.coords.longitude,
                        speed: spd,
                        updatedAt: timeStr,
                        timestamp: Date.now()
                    }).catch(() => {});
                },
                () => {},
                { enableHighAccuracy: true, maximumAge: 3000, timeout: 10000 }
            );

            listenToLocationRequestsForRep();
            listenToRemoteSupportForRep();
            listenToVoiceIntercomForRep();
        }

        function listenToLocationRequestsForRep() {
            if (!currentDelegate || currentDelegate.role !== 'delegate') return;
            db.ref('locationRequests/' + currentDelegate.code).on('value', (snapshot) => {
                const req = snapshot.val();
                const banner = document.getElementById('locationRequestRepBanner');
                if (req && req.status === 'pending') {
                    if (banner) {
                        banner.style.display = 'block';
                        banner.innerHTML = `
                            📢 <b>تنبيه عاجل من الإدارة:</b><br>
                            قام (<b>${req.requestedBy || 'مدير الحركة / الإدارة'}</b>) بطلب تحديث موقعك والسيارة الآن!
                            <button class="btn btn-primary" style="margin-top:8px; padding:7px 12px; font-size:12px; width:auto;" onclick="respondToLocationRequest(true)">📍 إرسال وتحديث موقعي فوراً</button>
                        `;
                    }
                    respondToLocationRequest(false);
                } else {
                    if (banner) banner.style.display = 'none';
                }
            });
        }

        function respondToLocationRequest(manualTrigger = false) {
            getCurrentGpsCoords().then(coords => {
                if (coords && coords.lat) {
                    const timeStr = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
                    db.ref('locations/' + currentDelegate.code).update({
                        name: currentDelegate.name,
                        lat: coords.lat,
                        lng: coords.lng,
                        speed: coords.speed || 0,
                        updatedAt: timeStr,
                        timestamp: Date.now()
                    });

                    db.ref('locationRequests/' + currentDelegate.code).update({
                        status: 'completed',
                        completedAt: timeStr
                    });

                    const banner = document.getElementById('locationRequestRepBanner');
                    if (banner) banner.style.display = 'none';

                    if (manualTrigger) alert("✅ تم إرسال وتحديث موقعك بنجاح للمدير ومدير الحركة!");
                } else if (manualTrigger) {
                    alert("⚠️ يرجى تفعيل الـ GPS في الهاتف لتتمكن من إرسال الموقع.");
                }
            });
        }

        function requestRepLocation(delCode, delName) {
            const requester = currentDelegate ? currentDelegate.name : "المدير";
            db.ref('locationRequests/' + delCode).set({
                requestedBy: requester,
                requestedRole: currentDelegate ? (currentDelegate.role || 'admin') : 'admin',
                timestamp: Date.now(),
                status: 'pending'
            }).then(() => {
                alert(`📡 تم إرسال طلب الموقع للمندوب (${delName}) بنجاح! سيظهر له تنبيه فوري لتحديث موقع السيارة.`);
            });
        }

        function openRepLiveMap(delCode, delName) {
            const loc = cloudLocations[delCode];
            if (loc && loc.lat && loc.lng) {
                const mapsUrl = `https://maps.google.com/?q=${loc.lat},${loc.lng}`;
                try {
                    window.location.href = `geo:${loc.lat},${loc.lng}?q=${loc.lat},${loc.lng}(سيارة ${encodeURIComponent(delName)})`;
                } catch(e) {}
                setTimeout(() => window.open(mapsUrl, '_blank'), 400);
            } else {
                if(confirm(`⚠️ لم يسجل المندوب (${delName}) إحداثيات GPS اليوم بعد.\nهل تريد إرسال تنبيه له بالضغط على "طلب الموقع"؟`)) {
                    requestRepLocation(delCode, delName);
                }

            for (let code in cloudDelegates) {
                if (code !== 'admin' && code !== 'store' && code !== 'fleet' && code !== 'hr' && code !== 'accountant') {
                    hasRows = true;
                    let del = cloudDelegates[code];
                    let loc = cloudLocations[code];
                    let req = cloudLocationRequests[code];
                    
                    let lat = loc ? loc.lat : null;
                    let lng = loc ? loc.lng : null;
                    let lastTime = loc ? (loc.updatedAt || 'اليوم') : 'غير متصل';
                    let speedText = loc && loc.speed ? `${loc.speed} كم/س` : '0 كم/س';

                    let lastOdoText = (del.lastOdometer && del.lastVehicle) ? `🚗 ${del.lastVehicle} (${del.lastOdometer} كم)` : '-';

                    let reqStatusHtml = '';

                        reqStatusHtml = `<div style="font-size:9.5px; color:#d97706; font-weight:bold; margin-top:2px;">⏳ انتظار التحديث...</div>`;

                        : '-';

                    let btnOpenDirect = (lat && lng) 
                        ? `<button class="btn btn-primary" style="padding:4px 6px; font-size:10px; width:auto; margin:0;" onclick="openRepLiveMap('${code}', '${del.name}')">🗺️ خريطة حية</button>`

                            <td>${btnDashcam}</td>

        function handleLogin() {
            const rawInput = (document.getElementById('loginCode')?.value || '').trim();
            const codeLower = rawInput.toLowerCase();
            const cleanInputPhone = cleanPhoneStr(rawInput);
            const pass = (document.getElementById('loginPass')?.value || '').trim();

            if(!rawInput || !pass) {
                alert("⚠️ يرجى كتابة كود المستخدم أو رقم الهاتف وكلمة السر.");
                return;
            }

            let foundCustomer = null;
            if (typeof portalCustomersDB === 'object' && portalCustomersDB !== null) {
                for(let uid in portalCustomersDB) {
                    let cust = portalCustomersDB[uid];
                    if (!cust) continue;
                    let custPhoneClean = cleanPhoneStr(cust.phone);

                    if((cust.clientCode && cust.clientCode.toLowerCase() === codeLower) ||
                       (cust.email && cust.email.toLowerCase() === codeLower) ||
                       (cust.name && cust.name.toLowerCase() === codeLower) ||
                       (cleanInputPhone && custPhoneClean && custPhoneClean === cleanInputPhone)) {
                        foundCustomer = cust;
                        break;
                    }
                }
            }

            if(foundCustomer) {
                if(foundCustomer.pass && String(foundCustomer.pass).trim() === pass) {
                    currentPortalCustomer = foundCustomer;
                    enterPortalCustomerDashboard();
                    return;
                } else {
                    alert("❌ كلمة السر غير صحيحة لحساب العميل.");
                    return;
                }

            if (codeLower === "admin" && (pass === ADMIN_PASS || pass === "Hossam2023@")) {
                currentDelegate = { code: "admin", name: "حسام (المدير)", role: "admin", allowedRoutes: ["ALL"] };

                const dDB = (typeof cloudDelegates === 'object' && Object.keys(cloudDelegates).length > 0) 
                            ? cloudDelegates 
                            : defaultDelegates;

                let targetKey = dDB[rawInput] ? rawInput : (dDB[codeLower] ? codeLower : null);

                            allowedRoutes: targetUser.allowedRoutes || ["ALL"]

                        alert("❌ كلمة السر غير صحيحة!");

                          (currentDelegate.role === 'hr' ? 'مسؤول HR' :

        function calcPortalOrderTotals() {
            if(!currentPortalCustomer || currentPortalCustomer.customerType === 'pending') return;
            const isWholesale = (currentPortalCustomer.customerType === 'wholesale');
            const fixedSystemPrice = isWholesale ? (systemSettings.defaultCartonPrice || 23925) : (systemSettings.defaultRibbonPrice || 480);
            let grand = 0, totalUnits = 0;

            products.forEach((p, idx) => {
                const q = parseFloat(document.getElementById(`portal_qty_${idx}`)?.value) || 0;
                const pr = fixedSystemPrice;
                const tot = q * pr;
                if(document.getElementById(`portal_total_${idx}`)) {
                    document.getElementById(`portal_total_${idx}`).value = tot.toFixed(2);
                }
                grand += tot;
                totalUnits += q;
            });

            if(document.getElementById('portalOrderGrandTotal')) {
                document.getElementById('portalOrderGrandTotal').innerText = grand.toFixed(2) + " ج.م";
            }
            if(document.getElementById('portalTotalUnitsCount')) {
                document.getElementById('portalTotalUnitsCount').innerText = `${totalUnits} ${isWholesale ? 'كرتونة' : 'رابطة'}`;
            }

            if(isWholesale) {
                const paid = parseFloat(document.getElementById('portalWholesalePaidInput')?.value) || 0;
                const zimam = grand - paid;
                if(document.getElementById('portalWholesaleZimam')) {
                    document.getElementById('portalWholesaleZimam').innerText = zimam.toFixed(2) + " ج.م";
                }
            }
        }

        function submitPortalClientOrder() {
            if(!currentPortalCustomer || currentPortalCustomer.customerType === 'pending') return;

            const isWholesale = (currentPortalCustomer.customerType === 'wholesale');
            const fixedPrice = isWholesale ? (systemSettings.defaultCartonPrice || 23925) : (systemSettings.defaultRibbonPrice || 480);
            const todayStr = new Date().toISOString().split('T')[0];
            let itemsList = [], totalUnits = 0, grandTotal = 0;

            products.forEach((p, idx) => {
                const q = parseFloat(document.getElementById(`portal_qty_${idx}`)?.value) || 0;
                const pr = fixedPrice;
                if(q > 0) {
                    const tot = q * pr;
                    itemsList.push({ name: p.name, code: p.code, qty: q, price: pr, total: tot, unit: isWholesale ? 'كرتونة' : 'رابطة' });
                    totalUnits += q;
                    grandTotal += tot;
                }
            });

            if(itemsList.length === 0) { alert(`❌ يرجى إدخال كمية لصنف واحد على الأقل.`); return; }

            let paid = isWholesale ? (parseFloat(document.getElementById('portalWholesalePaidInput')?.value) || 0) : 0;
            let zimam = isWholesale ? (grandTotal - paid) : 0;

            let orderObj = {
                id: String(Date.now()),
                clientId: currentPortalCustomer.uid,
                clientName: currentPortalCustomer.name,
                clientCode: currentPortalCustomer.clientCode || '',
                village: currentPortalCustomer.village || '',
                route: currentPortalCustomer.route || '',
                phone: currentPortalCustomer.phone || '',
                orderType: isWholesale ? 'wholesale' : 'retail',
                items: itemsList,
                totalUnits: totalUnits,
                grandTotal: grandTotal,
                paid: paid,
                zimam: zimam,
                date: todayStr,
                status: 'pending',
                location: currentPortalCustomer.location || null
            };

            cloudPendingOrders.push(orderObj);
            db.ref('pendingOrders').set(Object.assign({}, cloudPendingOrders)).then(() => {
                alert("🎉 تم إرسال طلب الفاتورة بنجاح!\nالطلب الآن بانتظار موافقة المدير.");
                let waItemsDetails = itemsList.map(it => `• ${it.name}: ${it.qty} ${it.unit} بسعر ${it.price} (إجمالي: ${it.total} ج.م)`).join('%0A');
                let waText = `طلب فاتورة جديد بانتظار موافقة المدير:%0A----------------------------%0A🏪 المحل: ${currentPortalCustomer.name}%0A🏷️ الكود: ${currentPortalCustomer.clientCode}%0A📍 القرية: ${currentPortalCustomer.village || ''}%0A🛣️ الخط: ${currentPortalCustomer.route || ''}%0A📅 التاريخ: ${todayStr}%0A📂 النوع: ${isWholesale ? 'جملة (بالكرتونة)' : 'قطاعي (بالرابطة)'}%0A----------------------------%0Aالأصناف المطلوبة:%0A${waItemsDetails}%0A----------------------------%0A📦 إجمالي الكمية: ${totalUnits} ${isWholesale ? 'كرتونة' : 'رابطة'}%0A💰 الإجمالي الكلي: ${grandTotal} ج.م%0A💵 المسدد: ${paid} ج.م%0A🔴 الذمم: ${zimam} ج.م`;
                window.open(`https://api.whatsapp.com/send?phone=${getTargetWhatsApp()}&text=${waText}`, '_blank');
                renderPortalProductsForm(true);
                renderClientOrdersStatusTable();
            });
        }

        function renderClientOrdersStatusTable() {
            const tbody = document.getElementById('clientOrdersStatusTableBody');
            if(!tbody || !currentPortalCustomer) return;
            tbody.innerHTML = '';

            let myOrders = cloudPendingOrders.filter(o => o.clientId === currentPortalCustomer.uid || (o.clientName === currentPortalCustomer.name));
            if(myOrders.length === 0) { tbody.innerHTML = `<tr><td colspan="5">لا توجد طلبات مرسلة حالياً.</td></tr>`; return; }

            myOrders.slice().reverse().forEach(o => {
                let statusBadge = '<span style="color:#d97706; font-weight:bold;">⏳ قيد مراجعة المدير</span>';

                if(o.status === 'rejected') statusBadge = '<span style="color:#dc2626; font-weight:bold;">❌ تم الرفض</span>';

                    route: order.route || '', date: order.date, items: order.items || [], location: order.location || null
                });

        function calcTotals() {
            let grand = 0;
            products.forEach((p, idx) => {
                const q = parseFloat(document.getElementById(`qty_${idx}`)?.value) || 0;
                const pr = parseFloat(document.getElementById(`price_${idx}`)?.value) || 0;
                const tot = q * pr;
                if(document.getElementById(`total_${idx}`)) document.getElementById(`total_${idx}`).value = tot.toFixed(2);
                grand += tot;
            });
            document.getElementById('grandTotal').innerText = grand.toFixed(2);
        }

        async function createInvoiceObject() {
            if(!currentDelegate || currentDelegate.role === 'viewer') return null;

            const vehicleKey = document.getElementById('invoiceVehicleSelect').value;
            const odometerReading = parseFloat(document.getElementById('invoiceOdometerInput').value);

            if(!vehicleKey) {
                alert("❌ بيان إلزامي: يرجى اختيار السيارة التي سوف تتحرك بها (الدبابة، بايك 1، بايك 2).");
                document.getElementById('invoiceVehicleSelect').focus();
                return null;
            }

            if(isNaN(odometerReading) || odometerReading <= 0) {
                alert("❌ بيان إلزامي: يرجى إدخال قراءة عداد السيارة الحالية قبل الخروج وحفظ الفاتورة.");
                document.getElementById('invoiceOdometerInput').focus();
                return null;
            }

            const vehicleName = cloudVehicles[vehicleKey]?.name || vehicleKey;
            const client = document.getElementById('clientName').value.trim() || "عميل نقدي";
            const village = document.getElementById('clientVillage').value.trim() || "";
            const invNo = document.getElementById('invoiceNo').value.trim() || "1001";
            const invDate = document.getElementById('invoiceDate').value;
            const route = document.getElementById('selectRouteFilter').value;

            let clientCode = cloudClients[client];
            if (!clientCode) {
                clientCode = "C-" + Math.floor(1000 + Math.random() * 9000);
                cloudClients[client] = clientCode;
                db.ref('clients/' + client).set(clientCode).catch(() => {});
            }

            let targetDelCode = currentDelegate.code;
            let grand = 0, hasItems = false, itemsSoldList = [], totalRibbonsCount = 0;
            let carStock = (cloudDelegates[targetDelCode] && cloudDelegates[targetDelCode].carStock) ? cloudDelegates[targetDelCode].carStock : {...defaultCarStock};

            for(let idx = 0; idx < products.length; idx++) {
                let p = products[idx];
                const qRibbons = parseFloat(document.getElementById(`qty_${idx}`).value) || 0;
                const pr = parseFloat(document.getElementById(`price_${idx}`).value) || 0;
                const tot = qRibbons * pr;

                if (qRibbons > 0) {
                    const qCartonsNeeded = qRibbons / 50;
                    let currentCarRibbons = Math.round((carStock[p.code] || 0) * 50);

                    if (qRibbons > currentCarRibbons) {
                        alert(`❌ الكمية المطلوبة من (${p.name}) أكبر من رصيد سيارتك (${currentCarRibbons} رابطة متبقية)!`);
                        return null;
                    }

                    hasItems = true;
                    grand += tot;
                    totalRibbonsCount += qRibbons;
                    let cartonsVal = Math.floor(qRibbons / 50);
                    let remVal = qRibbons % 50;
                    let qtyStr = cartonsVal > 0 ? `Outer ${pr} / ${cartonsVal} كرتونة${remVal>0?` + ${remVal} رابطة`:''}` : `Outer ${pr} / ${qRibbons} رابطة`;
                    itemsSoldList.push({ name: p.name, code: p.code, qty: qRibbons, qtyText: qtyStr, price: pr, total: tot });
                    carStock[p.code] = parseFloat(((carStock[p.code] || 0) - qCartonsNeeded).toFixed(4));
                }
            }

            if (!hasItems) { alert("أدخل كمية لصنف واحد على الأقل!"); return null; }

            const freshCoords = await getCurrentGpsCoords();
            let locObj = null;
            if (freshCoords && freshCoords.lat) {
                locObj = {
                    lat: freshCoords.lat,
                    lng: freshCoords.lng,
                    speed: freshCoords.speed || 0,
                    mapUrl: `https://maps.google.com/?q=${freshCoords.lat},${freshCoords.lng}`
                };
            }

            let clientLoc = locObj || cloudClientsLocations[client] || null;
            if (locObj) {
                cloudClientsLocations[client] = locObj;
                db.ref('clientsLocations/' + client).set(locObj).catch(() => {});
            }

            if(cloudDelegates[targetDelCode]) {
                cloudDelegates[targetDelCode].carStock = carStock;
                cloudDelegates[targetDelCode].lastVehicle = vehicleName;
                cloudDelegates[targetDelCode].lastOdometer = odometerReading;
                db.ref('delegates/' + targetDelCode).set(cloudDelegates[targetDelCode]).catch(() => {});
            }

            if (!cloudVehicles[vehicleKey]) cloudVehicles[vehicleKey] = { ...defaultVehicles[vehicleKey] };
            if (!cloudVehicles[vehicleKey].dailyLogs) cloudVehicles[vehicleKey].dailyLogs = {};

            const logDate = invDate || new Date().toISOString().split('T')[0];
            if (!cloudVehicles[vehicleKey].dailyLogs[logDate]) {
                cloudVehicles[vehicleKey].dailyLogs[logDate] = odometerReading;
                cloudVehicles[vehicleKey].currentKm = odometerReading;
                db.ref('vehicles/' + vehicleKey).set(cloudVehicles[vehicleKey]).catch(() => {});
            }

            let recordId = String(Date.now());
            const salesRecord = {
                id: recordId, invNo: invNo, date: invDate, delegateCode: targetDelCode,
                delegateName: cloudDelegates[targetDelCode] ? cloudDelegates[targetDelCode].name : currentDelegate.name, 
                client: client, village: village, route: route, clientCode: clientCode,
                vehicleKey: vehicleKey, vehicleName: vehicleName, odometer: odometerReading,
                total: grand, totalQty: totalRibbonsCount, status: 'active', items: itemsSoldList,
                location: locObj,
                clientLocation: clientLoc
            };

            cloudSales.push(salesRecord);
            await db.ref('sales').set(Object.assign({}, cloudSales));
            return salesRecord;
        }

        function renderSavedInvoices() {
            const tbody = document.getElementById('savedInvoicesBody');
            if(!tbody) return;
            tbody.innerHTML = '';

            const selectedDel = document.getElementById('filterDelegateSelect')?.value;
            const fromDate = document.getElementById('savedFilterFrom')?.value;
            const toDate = document.getElementById('savedFilterTo')?.value;
            const isAdm = (currentDelegate && (currentDelegate.code === 'admin' || currentDelegate.role === 'admin' || currentDelegate.role === 'fleet'));
            
            let filtered = cloudSales.filter(s => {
                if(currentDelegate) {
                    if(!isAdm && s.delegateCode !== currentDelegate.code) return false;
                    if(isAdm && selectedDel && selectedDel !== 'ALL' && s.delegateCode !== selectedDel) return false;
                }
                if(fromDate && s.date < fromDate) return false;
                if(toDate && s.date > toDate) return false;
                return true;
            });

            if(filtered.length === 0) { tbody.innerHTML = `<tr><td colspan="9">لا توجد فواتير مطابقة.</td></tr>`; return; }
            
            filtered.slice().reverse().forEach(inv => {
                let isCancelled = (inv.status === 'cancelled');
                let statusBadge = isCancelled ? `<span style="color:#dc2626; font-weight:bold;">ملغاة</span>` : `<span style="color:#16a34a; font-weight:bold;">نشطة</span>`;
                
                let actionButtons = `<button class="btn btn-thermal" style="padding:2px 6px; font-size:10px; width:auto; display:inline-block;" onclick="printDirectThermalDesktop(cloudSales.find(x=>x.id==='${inv.id}'))">🖨️ حراري</button> `;
                actionButtons += `<button class="btn btn-bluetooth" style="padding:2px 6px; font-size:10px; width:auto; display:inline-block;" onclick="printViaRawBT(cloudSales.find(x=>x.id==='${inv.id}'))">📱 RawBT</button> `;
                actionButtons += `<button class="btn" style="background:#0d9488; color:#fff; padding:2px 6px; font-size:10px; width:auto; display:inline-block;" onclick="printDirectBluetoothESC(cloudSales.find(x=>x.id==='${inv.id}'))">⚡ بلوتوث مباشر</button> `;
                actionButtons += `<button class="btn btn-info" style="padding:2px 6px; font-size:10px; width:auto; display:inline-block;" onclick="viewInvoiceDetails('${inv.id}')">👁️</button> `;
                
                if (isAdm) {
                    actionButtons += `<button class="btn btn-warning" style="padding:2px 6px; font-size:10px; width:auto; display:inline-block;" onclick="openEditInvoiceModal('${inv.id}')">✏️ تعديل</button> `;
                }

                if(!isCancelled && (isAdm || (currentDelegate && inv.delegateCode === currentDelegate.code))) {
                    actionButtons += `<button class="btn btn-danger" style="padding:2px 6px; font-size:10px; width:auto; display:inline-block;" onclick="cancelInvoice('${inv.id}')">❌</button>`;
                }

                tbody.innerHTML += `<tr><td><b>#${inv.invNo}</b></td><td>${inv.date}</td><td>${inv.client}</td><td><b>${inv.vehicleName || '-'}</b></td><td>${inv.odometer ? inv.odometer + ' كم' : '-'}</td><td>${inv.delegateName}</td><td>${inv.total} ج.م</td><td>${statusBadge}</td><td>${actionButtons}</td></tr>`;
            });

        function renderDailyReport() {

            const selDel = isAdm ? document.getElementById('reportDelegateSelect')?.value : (currentDelegate ? currentDelegate.code : '');

            const fromDate = document.getElementById('filterFromDate')?.value;

                    const matchDelegate = s.delegateName && s.delegateName.toLowerCase().includes(managerSearchVal);

        function updateClientsDatalist() {
            const sel = document.getElementById('selectExistingClient');
            if(!sel) return;

            const selectedRoute = document.getElementById('selectRouteFilter')?.value || 'ALL';
            const normSelected = normalizeRouteName(selectedRoute);
            sel.innerHTML = '<option value="">📋 عميل مسجل...</option>';

            let allClientsMap = {};

            for(let cName in cloudClients) {
                if(cName && cName.trim()) {
                    allClientsMap[cName.trim()] = {
                        code: cloudClients[cName],
                        route: cloudClientsRoutes[cName] || ''
                    };
                }
            }

            for(let uid in portalCustomersDB) {
                let pCust = portalCustomersDB[uid];
                if(pCust && pCust.name && pCust.name.trim()) {
                    let trimName = pCust.name.trim();
                    if(!allClientsMap[trimName]) {
                        allClientsMap[trimName] = {
                            code: pCust.clientCode || 'C-Auto',
                            route: pCust.route || ''
                        };
                    } else if(pCust.route) {
                        allClientsMap[trimName].route = pCust.route;
                    }
                }
            }

            for(let cName in allClientsMap) {
                let clientRoute = allClientsMap[cName].route || '';
                let clientCode = allClientsMap[cName].code || '';
                let normClientRoute = normalizeRouteName(clientRoute);

                let isMatch = false;
                if(selectedRoute === 'ALL') {
                    isMatch = true;
                } else if(normSelected && normClientRoute) {
                    isMatch = (normSelected === normClientRoute || clientRoute.trim() === selectedRoute.trim());
                }

                if(isMatch) {
                    let routeTag = clientRoute ? ` [${clientRoute}]` : '';
                    sel.innerHTML += `<option value="${cName}">${cName} (${clientCode})${routeTag}</option>`;
                }
            }
            updateReportClientsSelect();
        }

        function calcRatioLoading() {
            const totalTarget = parseFloat(document.getElementById('totalCartonsTarget')?.value) || 0;
            const resultBox = document.getElementById('ratioResultBox');
            if(!resultBox) return;

            if(totalTarget <= 0) {
                resultBox.innerHTML = "⚠️ أدخل إجمالي الكرتونات المراد تحميلها لعرض التفصيل.";
                return;
            }

            let items = [
                { name: "كليوباترا عادية", val: parseFloat(document.getElementById('ratioCleopatraVal')?.value) || 0, type: document.getElementById('ratioCleopatraType')?.value || 'ratio' },
                { name: "كيلوبترا بوكس", val: parseFloat(document.getElementById('ratioBoxVal')?.value) || 0, type: document.getElementById('ratioBoxType')?.value || 'ratio' },
                { name: "كليوباترا براون", val: parseFloat(document.getElementById('ratioBrownVal')?.value) || 0, type: document.getElementById('ratioBrownType')?.value || 'ratio' },
                { name: "سوبر 94", val: parseFloat(document.getElementById('ratioSuperVal')?.value) || 0, type: document.getElementById('ratioSuperType')?.value || 'percent' }
            ];

            let totalPercentCartons = 0;
            items.forEach(it => {
                if (it.type === 'percent' && it.val > 0) {
                    it.cartons = (totalTarget * it.val) / 100;
                    totalPercentCartons += it.cartons;
                } else if (it.type === 'percent') {
                    it.cartons = 0;
                }
            });

            let remainingCartons = Math.max(0, totalTarget - totalPercentCartons);
            let sumRatioWeights = 0;
            items.forEach(it => {
                if (it.type === 'ratio' && it.val > 0) {
                    sumRatioWeights += it.val;
                }
            });

            items.forEach(it => {
                if (it.type === 'ratio') {
                    it.cartons = (it.val > 0 && sumRatioWeights > 0) ? (remainingCartons * (it.val / sumRatioWeights)) : 0;
                }
            });

            let outputHtml = `<b>📦 تفصيل كميات التحميل لإجمالي (${totalTarget} كرتونة):</b><br>`;
            items.forEach(it => {
                let c = it.cartons || 0;
                let ribbons = Math.round(c * 50);
                let typeBadge = it.type === 'percent' ? `[${it.val}%]` : `[نسبة: ${it.val}]`;
                outputHtml += `• <b>${it.name}</b> ${typeBadge}: <span style="color:#0284c7; font-weight:bold;">${c.toFixed(1)} كرتونة</span> (${ribbons} رابطة)<br>`;
            });

            if (totalPercentCartons > totalTarget) {
                outputHtml += `<hr style="margin:6px 0; border:0; border-top:1px dashed #ef4444;"><span style="color:#dc2626; font-weight:bold;">⚠️ تنبيه: مجموع النسب المئوية يتجاوز 100%!</span>`;
            }

            resultBox.innerHTML = outputHtml;
        }

        async function loadMonthlyDebts() {
            const selectedMonth = document.getElementById('selectedMonth')?.value;
            const branch = document.getElementById('branchFilter')?.value || 'منوف';
            if (!selectedMonth) return;

            const [year, month] = selectedMonth.split('-').map(Number);
            const startOfMonth = new Date(year, month - 1, 1).getTime();
            const endOfMonth = new Date(year, month, 0, 23, 59, 59, 999).getTime();

            const clientsLedger = {};

            cloudShops.forEach(s => {
                if (branch !== "الكل") {
                    const isMenof = (s.village && s.village.includes("منوف")) ||
                                    (s.route && s.route.includes("منوف")) ||
                                    (s.branch && s.branch.includes("منوف")) ||
                                    (!s.branch && !s.route);
                    if (!isMenof && s.branch && s.branch !== branch) return;
                }

                const clientName = s.name || s.clientName || 'عميل غير محدد';
                const txDate = s.date ? new Date(s.date).getTime() : Date.now();
                const totalAmount = parseFloat(s.totalPrice || 0);
                const paidAmount = parseFloat(s.paid || 0);

                if (!clientsLedger[clientName]) {
                    clientsLedger[clientName] = {
                        name: clientName,
                        previousBalance: 0,
                        monthSales: 0,
                        monthPaid: 0,
                        closingBalance: 0
                    };
                }

                if (txDate < startOfMonth) {
                    clientsLedger[clientName].previousBalance += (totalAmount - paidAmount);
                } else if (txDate >= startOfMonth && txDate <= endOfMonth) {
                    clientsLedger[clientName].monthSales += totalAmount;
                    clientsLedger[clientName].monthPaid += paidAmount;
                }
            });

            cloudSales.forEach(s => {
                if (s.status === 'cancelled') return;
                if (branch !== "الكل") {
                    const isMenof = (s.village && s.village.includes("منوف")) ||
                                    (s.route && s.route.includes("منوف")) ||
                                    (s.branch && s.branch.includes("منوف"));
                    if (!isMenof && s.branch && s.branch !== branch) return;
                }

                const clientName = s.client || 'عميل نقدي';
                const txDate = s.date ? new Date(s.date).getTime() : Date.now();
                const totalAmount = parseFloat(s.total || 0);
                const paidAmount = parseFloat(s.paid !== undefined ? s.paid : s.total);

                if (!clientsLedger[clientName]) {
                    clientsLedger[clientName] = {
                        name: clientName,
                        previousBalance: 0,
                        monthSales: 0,
                        monthPaid: 0,
                        closingBalance: 0
                    };
                }

                if (txDate < startOfMonth) {
                    clientsLedger[clientName].previousBalance += (totalAmount - paidAmount);
                } else if (txDate >= startOfMonth && txDate <= endOfMonth) {
                    clientsLedger[clientName].monthSales += totalAmount;
                    clientsLedger[clientName].monthPaid += paidAmount;
                }
            });

            let grandPrevious = 0, grandSales = 0, grandPaid = 0, grandClosing = 0;
            const tbody = document.getElementById('debtsTableBody');
            if (!tbody) return;
            tbody.innerHTML = '';

            const clientKeys = Object.keys(clientsLedger);
            if (clientKeys.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6">لا توجد حركات أو ذمم مسجلة لهذا الشهر.</td></tr>';
            }

            clientKeys.forEach(k => {
                const client = clientsLedger[k];
                client.closingBalance = client.previousBalance + client.monthSales - client.monthPaid;

                if (Math.abs(client.previousBalance) < 0.01 && Math.abs(client.monthSales) < 0.01 && Math.abs(client.monthPaid) < 0.01) {
                    return;
                }

                grandPrevious += client.previousBalance;
                grandSales += client.monthSales;
                grandPaid += client.monthPaid;
                grandClosing += client.closingBalance;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>${client.name}</b></td>
                    <td style="color:${client.previousBalance > 0 ? '#dc2626' : '#16a34a'}; font-weight:bold;">${client.previousBalance.toFixed(2)} ج.م</td>
                    <td style="color:#2563eb; font-weight:bold;">${client.monthSales.toFixed(2)} ج.م</td>
                    <td style="color:#16a34a; font-weight:bold;">${client.monthPaid.toFixed(2)} ج.م</td>
                    <td style="color:${client.closingBalance > 0 ? '#dc2626' : '#16a34a'}; font-weight:bold; background:${client.closingBalance > 0 ? '#fee2e2' : '#f0fdf4'};">${client.closingBalance.toFixed(2)} ج.م</td>
                    <td>
                        <button class="btn btn-primary" style="padding:3px 8px; font-size:10px; width:auto; margin:0;" onclick="printClientStatement('${client.name}', '${selectedMonth}', ${client.previousBalance}, ${client.monthSales}, ${client.monthPaid}, ${client.closingBalance})">🖨️ طباعة كشف</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            if (document.getElementById('totalPreviousBalance')) document.getElementById('totalPreviousBalance').innerText = `${grandPrevious.toFixed(2)} ج.م`;
            if (document.getElementById('totalMonthSales')) document.getElementById('totalMonthSales').innerText = `${grandSales.toFixed(2)} ج.م`;
            if (document.getElementById('totalMonthPaid')) document.getElementById('totalMonthPaid').innerText = `${grandPaid.toFixed(2)} ج.م`;
            if (document.getElementById('totalClosingBalance')) document.getElementById('totalClosingBalance').innerText = `${grandClosing.toFixed(2)} ج.م`;
        }

        function saveLmInvoice() {
            const type = document.getElementById('lmInvoiceType').value;
            const deposit = parseFloat(document.getElementById('lmDeposit').value) || 0;
            const editId = document.getElementById('editLmId').value;
            let totalCost = 0, totalSell = 0, items = [];

            lmItemsList.forEach((it, idx) => {
                const q = parseFloat(document.getElementById(`lm_qty_${idx}`)?.value) || 0;
                const sellP = parseFloat(document.getElementById(`lm_sell_price_${idx}`)?.value) || 0;
                if(q > 0) {
                    const cost = q * it.buyPricePerCarton;
                    const sell = q * sellP;
                    totalCost += cost;
                    totalSell += sell;
                    items.push({ name: it.name, qty: q, costPrice: it.buyPricePerCarton, sellPrice: sellP, costTotal: cost, sellTotal: sell });
                }
            });

            if(items.length === 0 && deposit === 0) { alert("أدخل بيانات الفاتورة."); return; }

            let profit = totalSell - totalCost;

            if(editId) {
                let rec = cloudLmInvoices.find(x => String(x.id) === String(editId));
                if(rec) {
                    rec.type = type; rec.deposit = deposit; rec.totalCost = totalCost; rec.totalSell = totalSell; rec.profit = profit; rec.items = items;
                }
            } else {
                cloudLmInvoices.push({ id: String(Date.now()), type, deposit, totalCost, totalSell, profit, items, date: new Date().toISOString().split('T')[0] });
            }

            db.ref('lmInvoices').set(Object.assign({}, cloudLmInvoices)).then(() => {
                alert("✅ تم حفظ فاتورة LM بنجاح!");
                document.getElementById('editLmId').value = '';

            document.getElementById('modalEditUserLocked').value = u.locked ? 'true' : 'false';
            document.getElementById('editUserModal').style.display = 'flex';
        }

        function closeEditUserModal() { document.getElementById('editUserModal').style.display = 'none'; }

        function saveEditedUser() {
            const code = document.getElementById('modalEditUserOrigCode').value;
            const name = document.getElementById('modalEditUserName').value.trim();
            const pass = document.getElementById('modalEditUserPass').value.trim();
            const role = document.getElementById('modalEditUserRole').value;
            const locked = (document.getElementById('modalEditUserLocked').value === 'true');

            if(!name || !pass) { alert("أدخل اسم الموظف وكلمة السر."); return; }

            if(cloudDelegates[code]) {
                cloudDelegates[code].name = name;
                cloudDelegates[code].pass = pass;
                cloudDelegates[code].role = role;
                cloudDelegates[code].locked = locked;
            }

            db.ref('delegates/' + code).set(cloudDelegates[code]).then(() => {
                alert("✅ تم تعديل وحفظ بيانات الموظف بنجاح!");
                closeEditUserModal();
                renderAdminUsersTable();
                updateDelegatesSelects();
            });
        }

        function deleteUserAccount(code) {
            if(code === 'admin') { alert("لا يمكن حذف حساب المدير الرئيسي."); return; }
            if(!confirm(`⚠️ هل أنت متأكد من حذف حساب الموظف (${cloudDelegates[code]?.name}) نهائياً؟`)) return;

            delete cloudDelegates[code];
            db.ref('delegates/' + code).remove().then(() => {
                alert("✅ تم حذف حساب الموظف.");
                renderAdminUsersTable();
                updateDelegatesSelects();
            });
        }

        function changeMyPassword() {
            const currentPass = document.getElementById('currentPassInput').value.trim();
            const newPass = document.getElementById('newPassInput').value.trim();
            if(!newPass) { alert("أدخل كلمة السر الجديدة."); return; }

            if(currentDelegate.role === 'admin') {
                if(currentPass !== ADMIN_PASS) { alert("كلمة السر الحالية غير صحيحة."); return; }
                ADMIN_PASS = newPass;
                cloudDelegates['admin'].pass = newPass;
                db.ref('delegates/admin/pass').set(newPass).then(() => {
                    alert("✅ تم تغيير كلمة سر المدير بنجاح!");
                    document.getElementById('currentPassInput').value = '';
                    document.getElementById('newPassInput').value = '';
                });
            } else {
                let d = cloudDelegates[currentDelegate.code];
                if(d.pass !== currentPass) { alert("كلمة السر الحالية غير صحيحة."); return; }
                d.pass = newPass;
                db.ref('delegates/' + currentDelegate.code + '/pass').set(newPass).then(() => {
                    alert("✅ تم تغيير كلمة السر بنجاح!");
                    document.getElementById('currentPassInput').value = '';
                    document.getElementById('newPassInput').value = '';
                });
            }
        }

        // ==================== إدارة وتعديل العملاء بالكامل ====================
        function renderAdminPortalCustomersTable() {
            const tbody = document.getElementById('adminPortalCustomersBody');
            if(!tbody) return;
            tbody.innerHTML = '';

            let hasRows = false;
            for(let uid in portalCustomersDB) {
                hasRows = true;
                let c = portalCustomersDB[uid];
                let typeBadge = c.customerType === 'wholesale' ? '<span style="color:#16a34a; font-weight:bold;">جملة</span>' : (c.customerType === 'retail' ? '<span style="color:#2563eb; font-weight:bold;">قطاعي</span>' : '<span style="color:#d97706; font-weight:bold;">جديد</span>');

                tbody.innerHTML += `
                    <tr>
                        <td><input type="checkbox" class="clientRowCheckbox" value="${uid}"></td>
                        <td><b>${c.name}</b></td>
                        <td style="color:#2563eb; font-weight:bold;">${c.clientCode || '-'}</td>
                        <td style="color:#16a34a; font-weight:bold;">${c.route || '-'}</td>
                        <td>${c.phone || '-'}<br><small style="color:#64748b;">${c.village || ''}</small></td>
                        <td>${typeBadge}</td>
                        <td><small>${c.pass || '-'}</small></td>
                        <td>
                            <button class="btn btn-warning" style="padding:2px 6px; font-size:10px; width:auto; margin:0 2px;" onclick="openEditCustomerModal('${uid}')">✏️ تعديل</button>
                            <button class="btn btn-danger" style="padding:2px 6px; font-size:10px; width:auto; margin:0 2px;" onclick="adminDeleteCustomer('${uid}', '${c.name}')">🗑️</button>
                        </td>
                    </tr>`;
            }

            if(!hasRows) tbody.innerHTML = `<tr><td colspan="8">لا يوجد عملاء مسجلين بالبوابة.</td></tr>`;
        }

        function toggleSelectAllClients(master) {
            const checkboxes = document.querySelectorAll('.clientRowCheckbox');
            checkboxes.forEach(cb => cb.checked = master.checked);
        }

        function deleteSelectedClients() {
            const checkedBoxes = Array.from(document.querySelectorAll('.clientRowCheckbox:checked'));
            if(checkedBoxes.length === 0) { alert("يرجى تحديد عميل واحد على الأقل للمسح."); return; }
            if(!confirm(`⚠️ هل أنت متأكد من مسح ${checkedBoxes.length} عميل تم تحديدهم؟`)) return;

            checkedBoxes.forEach(cb => {
                let uid = cb.value;
                let c = portalCustomersDB[uid];
                if(c) {
                    delete cloudClients[c.name];
                    delete cloudClientsRoutes[c.name];
                    delete cloudClientsLocations[c.name];
                    db.ref('clients/' + c.name).remove();
                    db.ref('clientsRoutes/' + c.name).remove();
                    db.ref('clientsLocations/' + c.name).remove();
                }
                delete portalCustomersDB[uid];
                db.ref('portalCustomers/' + uid).remove();
            });

            alert("✅ تم مسح العملاء المحددين بنجاح.");
            renderAdminPortalCustomersTable();
            populateRoutesList();
            updateClientsDatalist();
        }

        function exportClientsFast() {
            let data = [];
            for(let uid in portalCustomersDB) {
                let c = portalCustomersDB[uid];
                data.push({
                    "اسم العميل": c.name || '',
                    "الكود الثابت": c.clientCode || '',
                    "خط السير": c.route || '',
                    "القرية/العنوان": c.village || c.address || '',
                    "رقم الهاتف": c.phone || '',
                    "كلمة السر": c.pass || '',
                    "الفئة": c.customerType || 'retail'
                });
            }
            if(data.length === 0) { alert("لا توجد بيانات عملاء للتصدير."); return; }
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "العملاء");
            XLSX.writeFile(wb, "قائمة_العملاء_بلاك_هورس.xlsx");
        }

        function importClientsFromExcel(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(firstSheet);
                if(jsonData.length === 0) { alert("الشيت فارغ!"); return; }
                
                jsonData.forEach((row, i) => {
                    const name = (row['اسم العميل'] || row['الاسم'] || row['Name'] || '').toString().trim();
                    if(!name) return;
                    const code = (row['الكود الثابت'] || row['الكود'] || row['Code'] || ("C-" + (1000 + i))).toString().trim();
                    const route = (row['خط السير'] || row['الخط'] || row['Route'] || '').toString().trim();
                    const village = (row['القرية/العنوان'] || row['القرية'] || row['العنوان'] || '').toString().trim();
                    const phone = (row['رقم الهاتف'] || row['الهاتف'] || row['Phone'] || '').toString().trim();
                    const pass = (row['كلمة السر'] || row['الباسورد'] || '123456').toString().trim();
                    const type = (row['الفئة'] || 'retail').toString().trim();
                    
                    const uid = "cust_" + Date.now() + "_" + i;
                    portalCustomersDB[uid] = { uid, name, clientCode: code, route, village, phone, pass, customerType: type };
                    cloudClients[name] = code;
                    if(route) cloudClientsRoutes[name] = route;
                    db.ref('portalCustomers/' + uid).set(portalCustomersDB[uid]);
                    db.ref('clients/' + name).set(code);
                    if(route) db.ref('clientsRoutes/' + name).set(route);
                });
                alert(`✅ تم استيراد ${jsonData.length} عميل بنجاح!`);
                renderAdminPortalCustomersTable();
                populateRoutesList();
                updateClientsDatalist();
            };
            reader.readAsArrayBuffer(file);
            event.target.value = '';
        }

        function openEditCustomerModal(uid) {
            let c = portalCustomersDB[uid];
            if(!c) return;
            document.getElementById('modalEditCustUid').value = uid;
            document.getElementById('modalEditCustName').value = c.name || '';
            document.getElementById('modalEditCustCode').value = c.clientCode || '';
            document.getElementById('modalEditCustRoute').value = c.route || '';
            document.getElementById('modalEditCustVillage').value = c.village || '';
            document.getElementById('modalEditCustPhone').value = c.phone || '';
            document.getElementById('modalEditCustPass').value = c.pass || '';
            document.getElementById('modalEditCustType').value = c.customerType || 'retail';
            document.getElementById('editCustomerModal').style.display = 'flex';
        }

        function closeEditCustomerModal() { 
            document.getElementById('editCustomerModal').style.display = 'none'; 
        }

        function saveEditedCustomer() {
            const uid = document.getElementById('modalEditCustUid').value;
            let c = portalCustomersDB[uid];
            if(!c) return;

            const oldName = c.name;
            const newName = document.getElementById('modalEditCustName').value.trim();
            const code = document.getElementById('modalEditCustCode').value.trim();
            const route = document.getElementById('modalEditCustRoute').value.trim();
            const village = document.getElementById('modalEditCustVillage').value.trim();
            const phone = document.getElementById('modalEditCustPhone').value.trim();
            const pass = document.getElementById('modalEditCustPass').value.trim();
            const type = document.getElementById('modalEditCustType').value;

            if(!newName) { alert("أدخل اسم العميل."); return; }

            c.name = newName;
            c.clientCode = code;
            c.route = route;
            c.village = village;
            c.phone = phone;
            c.pass = pass;
            c.customerType = type;

            if(oldName !== newName) {
                delete cloudClients[oldName];
                delete cloudClientsRoutes[oldName];
                db.ref('clients/' + oldName).remove();
                db.ref('clientsRoutes/' + oldName).remove();
            }

            cloudClients[newName] = code;
            if(route) cloudClientsRoutes[newName] = route;

            db.ref('portalCustomers/' + uid).set(c);
            db.ref('clients/' + newName).set(code);
            if(route) db.ref('clientsRoutes/' + newName).set(route);

            alert("✅ تم تعديل وتحديث بيانات العميل بنجاح!");
            closeEditCustomerModal();
            renderAdminPortalCustomersTable();
            populateRoutesList();
            updateClientsDatalist();
        }

        function adminDirectAddCustomer() {
            const name = document.getElementById('adminDirectName').value.trim();
            const code = document.getElementById('adminDirectCode').value.trim() || ("C-" + Math.floor(1000 + Math.random() * 9000));
            const route = document.getElementById('adminDirectRoute').value.trim();
            const village = document.getElementById('adminDirectVillage').value.trim();
            const phone = document.getElementById('adminDirectPhone').value.trim();
            const pass = document.getElementById('adminDirectPass').value.trim() || "123456";
            const type = document.getElementById('adminDirectType').value;

            if(!name) { alert("أدخل اسم العميل."); return; }

            const uid = "cust_" + Date.now();
            portalCustomersDB[uid] = { uid, name, clientCode: code, route, village, phone, pass, customerType: type };
            cloudClients[name] = code;
            if(route) cloudClientsRoutes[name] = route;

            db.ref('portalCustomers/' + uid).set(portalCustomersDB[uid]);
            db.ref('clients/' + name).set(code);
            if(route) db.ref('clientsRoutes/' + name).set(route);

            alert(`✅ تم حفظ وتفعيل العميل (${name}) بنجاح!`);
            document.getElementById('adminDirectName').value = '';
            document.getElementById('adminDirectCode').value = '';
            document.getElementById('adminDirectRoute').value = '';
            document.getElementById('adminDirectVillage').value = '';
            document.getElementById('adminDirectPhone').value = '';
            document.getElementById('adminDirectPass').value = '';
            renderAdminPortalCustomersTable();
        }

        function adminDeleteCustomer(uid, name) {
            if(!confirm(`هل أنت متأكد من حذف العميل (${name}) نهائياً؟`)) return;
            delete portalCustomersDB[uid];
            delete cloudClients[name];
            delete cloudClientsRoutes[name];
            delete cloudClientsLocations[name];

            db.ref('portalCustomers/' + uid).remove();
            db.ref('clients/' + name).remove();
            db.ref('clientsRoutes/' + name).remove();
            db.ref('clientsLocations/' + name).remove().then(() => {
                alert(`✅ تم حذف العميل (${name}) بنجاح.`);
                renderAdminPortalCustomersTable();
                populateRoutesList();
                updateClientsDatalist();
            });
        }
    </script>
</body>
